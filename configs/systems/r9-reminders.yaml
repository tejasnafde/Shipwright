# The round 9 adapter with tool guards and per-turn status reminders (reminders.py). The adapter was trained
# without reminders, so gate it next to r9-weight (same adapter, no reminders) before reading the difference.
name: r9-reminders
model: CohereLabs/tiny-aya-global
adapter:
  repo: mitushigoyal5/shipwright-lora
  revision: round-9
route: weight_fix
targets:
- invented_id
- tool_example_copied
- loop
- tool_error_ignored
- unknown_tool
- malformed_args
- wrong_tool
- bad_arguments
- wrong_order
- skipped_policy_step
- invented_answer
- premature_transfer
tool_guards: true
state_reminders: true
