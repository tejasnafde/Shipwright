# Rounds 15 and 16 (2026-11-15, Ishank): one unattended run from gate 14's refusal, if gate 14 refuses.
#   shipwright run --config configs/rounds/r15-capacity.yaml --launch
# Gate 13 failed only non_target, on context overflow (13 of 60 runs against 0). Read from the traces (AGENTS.md,
# 2026-11-15): lookup sprees (up to 38 lookups in a row; passing runs never pass 9), after which the dropped turns took
# the customer's identity with them and the agent asked for it again; 52 of round 13's 176 correction rows taught that.
# Gate 14 (Mitushi, configs/rounds/r14-regate.yaml) re-gates the round 13 adapter with the guards against those runs.
# If it promotes, this run is not needed. If it refuses with context overflow still up, the recipe turns on capacity:
# the short policy (about 900 tokens more room on every turn) in serving and in the data, the identity kept when turns
# are dropped (in the data too), corrections that lost the identity dropped, a teacher harvest of every train task under
# the short policy (more and matching data), then a fresh LoRA and the gate (round 15). If round 15 refuses but improves
# on gate 14, round 16 is a third corrections round on its own failures; if it does not improve, the loop stops.
# Everything a rerun needs is here. The manifest (runs/r<round>-round/round.json) records this file resolved, with the
# code sha, the image and the hashes of the frozen gate and split files. Copy the file to change anything.

round: 15
rounds: 2                 # round 15 (capacity) and, after a refusal that improved, round 16 (corrections on its failures)
owner: ishank
git_sha: null             # null: the image's commit, recorded. Set it to reproduce a run: the run refuses another commit.
seed: 300

frozen:
  splits: configs/splits.yaml
  gate: configs/gate.yaml

start:                    # continue from gate 14's refusal (gate/round-14 on the runs dataset): the round 13 adapter
  from_round: 14          # with Mitushi's guards
  candidate: configs/systems/r14-r13-fixes.yaml
  failures_run: ishank/r13-cand-train    # the round 13 adapter's classified failures on the train tasks

recipe:                   # how the round 13 adapter was made (configs/rounds/r12-final.yaml, round 13)
  tool_guards: true
  general_replay: 100
  boost: 1
  corrections_rounds: 2

models:
  agent: openai/CohereLabs/tiny-aya-global:cohere            # Tiny Aya Global on the HF router
  user: openai/openai/gpt-oss-120b:deepinfra                 # user simulator and tau2 judge (the gate uses the same)
  teacher: vertex/deepseek-ai/deepseek-v4.1-flash-maas
  classifier: vertex/openai/gpt-oss-120b-maas                # AgentTune FailureClassifier

baseline:                 # not run here (no fresh round); the config keeps the full shape
  num_tasks: 0
  trials: 1
  max_concurrency: 10

teacher:
  trials: 3
  max_concurrency: 10     # one DeepSeek job at a time (AGENTS.md, round 9)
  capacity_harvest_trials: 4   # the capacity round plays every train task 4 times under the short policy: about 296
                               # runs at about $0.007 (r10-teacher), about 40% pass since the simulator fixes

candidate_train:          # round 16 only: the round 15 candidate on the train tasks
  flavors: [a10g-large]
  timeout: 40m
  trials: 1

data:
  repo: mitushigoyal5/shipwright-sft
  pool:                   # teacher runs whose passes are training data (all DeepSeek V4.1 Flash, train split), rendered
    - tejas/r1-teacher-t1 #   with the short policy like every other row
    - tejas/r1-teacher-all-t2
    - tejas/r1-teacher-ds-a
    - tejas/r1-teacher-ds-b
    - tejas/r1-teacher-ds-c
    - tejas/bake-dsv41flash
    - ishank/r2-teacher
    - ishank/r3-teacher
    - tejas/r9-teacher
    - mitushi/r10-teacher
  corrections_pool:       # round 13's own and the round 8 candidate's; corrections that lost the identity are dropped
    - ishank/r13-corrections
    - tejas/r9-corrections

train:
  output_repo: mitushigoyal5/shipwright-lora
  flavors: [l40sx1]
  timeout: 45m
  epochs: 2
  learning_rate: 0.0001
  extra_args: []
  require_trigger: true

gate:
  runs_repo: mitushigoyal5/shipwright-runs
  candidate_template: configs/systems/r14-r13-fixes.yaml         # targets of a trained candidate; name, adapter, switches set
  flavors: [a10g-large]
  timeout: 60m
  screen_bfcl: false      # BFCL held at 71 to 73 in gates 8 to 13
  screen_timeout: 30m
  api_usd: 0.6

stop:
  max_infra_error_rate: 0.25
  min_sft_examples: 40
  retries: 1

spend:                    # USD caps; a stage starts only if its cap plus what is spent fits in total
  baseline: 2.0           # not run
  candidate_train: 1.0    # round 16: worst case a10g-large $1.50/h x 40m
  classify: 0.3
  teacher: 2.5            # the harvest; teacher_runs.py stops itself at this metered cost
  corrections: 0.4
  data: 0.0
  train: 1.4              # worst case l40sx1 $1.80/h x 45m = $1.35
  bfcl_screen: 1.0        # not run
  gate: 2.1               # worst case a10g-large $1.50/h x 1h + $0.60 of simulator (gates 12, 13: $1.38, $1.65)
  total: 9.0              # NOT approved yet. Expected: round 15 about $4.7 (harvest 2.0, train 1.05, gate 1.65),
                          # round 16 about $3.5; a stage whose cap no longer fits is not started

cloud:
  task_timeout: 8h
