# Deploy gate config (step 05 GATE, docs/system-design.html). Read by scripts/gate_eval.py.
#
# status: proposed. The team must freeze this file before round 1 (AGENTS.md, Evaluation
# rules): set status to frozen and frozen_on to the date. After that, a change needs a line
# with the change and the reason in docs/notes.md first.
status: proposed
frozen_on: null

heldout:
  domain: retail
  task_split: test        # tau2 retail test split: 40 tasks. Never train on it.
  num_tasks: 40           # 0 would also mean all; 40 is the whole split
k: 3                      # trials per task; pass^k uses all k
seed: 300                 # tau2 base seed (it derives one seed per trial)
agent_temperature: 0.0    # same as the baseline; the user simulator gives the variation
max_steps: 100
max_concurrency: 8

# The user simulator model is NOT set here: the team has not chosen it. It is a required
# argument of scripts/gate_job.py and scripts/gate_eval.py (--user-model).

classify:
  judge_model: null       # null: rule labels only (deterministic, free). Set a frozen judge to add its labels.

thresholds:
  min_valid_runs: 108             # per system, absolute floor (90% of 40 tasks x k=3)
  min_valid_run_fraction: 0.9     # per system, of the runs asked for (tasks x k)
  min_complete_tasks: 36          # per system, tasks with all k trials valid (pass^k needs them)
  pass_1_max_drop: 0.0            # candidate pass^1 must not be lower (a tie passes)
  pass_k_max_drop: 0.0            # candidate pass^k must not be lower (a tie passes)
  target_label_min_drop: 0.025    # target-label failure rate must drop by >= 2.5 points (3 of 120 runs); a tie rejects
  non_target_max_increase: 0.05   # other failure labels may rise by at most 5 points (null: off)
  bfcl_max_drop_points: 2.0       # BFCL accuracy may drop by at most 2 points

bfcl:
  enabled: true
  revision: 61fc0608cfd831fcfbbaa676ebdfef0ed963eeda   # gorilla-llm/Berkeley-Function-Calling-Leaderboard
  categories: [simple, multiple, irrelevance]           # one call per reply (our prompted protocol)
  limit_per_category: 100

serve:
  mode: lora              # lora: one vLLM server, adapters as LoRA modules; merged: peft merge, one server per system
  vllm: vllm==0.32.0      # first vLLM with CohereCompass is 0.30; Cohere2ForCausalLM supports LoRA
  max_lora_rank: 16       # scripts/train_lora.py trains r=16
  max_model_len: 8192     # Tiny Aya context
  gpu_memory_utilization: 0.85
  startup_timeout_s: 1200
