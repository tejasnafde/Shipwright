<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 610" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Roboto, sans-serif" role="img" aria-label="The self-healing loop: run, detect, classify, route by root cause, correct, train, gate, then promote or refuse and run again."><style>
.bg{fill:#1a1a19} .box{fill:#232321;stroke:#3a3a37;stroke-width:1.2}
.weight{stroke:#3987e5;stroke-width:1.6}
.t{fill:#f0efec;font-weight:700;font-size:15px} .s{fill:#c3c2b7;font-size:12.5px} .n{fill:#9a998f;font-size:12px}
.arrow{stroke:#7a7973;stroke-width:1.6;fill:none} .head{fill:#7a7973} .dash{stroke-dasharray:5 4}
.at{fill:#1d2a3a} .at-t{fill:#8fbcf2} .ak{fill:#3a2419} .ak-t{fill:#f3a27f}
.ours{fill:#2c2c2a} .ours-t{fill:#c3c2b7} .pt{font-size:11px;font-weight:600}
.ok{fill:#4cc27f} .bad{fill:#9a998f} .glow{fill:none;stroke:#3987e5;stroke-width:3} .dot{fill:#3987e5}
.foot{fill:#c3c2b7;font-size:12.5px} .foot b{fill:#f0efec}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" width="1040" height="610"/><rect class="box " x="30" y="40" width="210" height="84" rx="10"/><text class="t" x="44" y="66">1  Run</text><text class="s" x="44" y="88">Tiny Aya 3.35B student</text><text class="n" x="44" y="108">+ guards · 74 tasks · $0.53</text><rect class="ours" x="151" y="51" width="79" height="19" rx="9.5"/><text class="pt ours-t" x="190" y="64.5" text-anchor="middle">tau2-bench</text><rect class="box " x="290" y="40" width="210" height="84" rx="10"/><text class="t" x="304" y="66">2  Detect</text><text class="s" x="304" y="88">tau2 grader + FailureDetector</text><text class="n" x="304" y="108">every failed conversation</text><rect class="at" x="418" y="51" width="72" height="19" rx="9.5"/><text class="pt at-t" x="454" y="64.5" text-anchor="middle">AgentTune</text><rect class="box " x="550" y="40" width="210" height="84" rx="10"/><text class="t" x="564" y="66">3  Classify</text><text class="s" x="564" y="88">rules, then FailureClassifier</text><text class="n" x="564" y="108">a root cause each · $0.05</text><rect class="at" x="678" y="51" width="72" height="19" rx="9.5"/><text class="pt at-t" x="714" y="64.5" text-anchor="middle">AgentTune</text><rect class="box " x="810" y="40" width="210" height="84" rx="10"/><text class="t" x="824" y="66">4  Route</text><text class="s" x="824" y="88">by root cause</text><text class="n" x="824" y="108">tool · model · environment</text><rect class="ours" x="971" y="51" width="39" height="19" rx="9.5"/><text class="pt ours-t" x="990" y="64.5" text-anchor="middle">ours</text><path class="arrow" d="M240,82 H286" marker-end="url(#h)"/><path class="arrow" d="M500,82 H546" marker-end="url(#h)"/><path class="arrow" d="M760,82 H806" marker-end="url(#h)"/><path class="arrow" d="M915,124 V150 H555 M745,150 V176 M935,150"/><path class="arrow" d="M555,150 V176" marker-end="url(#h)"/><path class="arrow" d="M745,150 V176" marker-end="url(#h)"/><path class="arrow" d="M915,150 H935 V176" marker-end="url(#h)"/><rect class="box " x="470" y="180" width="170" height="70" rx="10"/><text class="t" x="484" y="204">Tool fault</text><text class="s" x="484" y="223">→ guards, tool text</text><text class="n" x="484" y="240">a person approves</text><rect class="box weight" x="660" y="180" width="170" height="70" rx="10"/><text class="t" x="674" y="204">Model fault</text><text class="s" x="674" y="223">→ weight fix</text><text class="n" x="674" y="240">continues below</text><rect class="box " x="850" y="180" width="170" height="70" rx="10"/><text class="t" x="864" y="204">Environment</text><text class="s" x="864" y="223">→ no fix</text><text class="n" x="864" y="240">never trained on</text><path class="arrow" d="M745,250 V296" marker-end="url(#h)"/><rect class="box " x="640" y="300" width="210" height="84" rx="10"/><text class="t" x="654" y="326">5  Correct</text><text class="s" x="654" y="348">teacher fixes each wrong turn</text><text class="n" x="654" y="368">59 new (235 in all) · $0.12</text><rect class="ours" x="801" y="311" width="39" height="19" rx="9.5"/><text class="pt ours-t" x="820" y="324.5" text-anchor="middle">ours</text><rect class="box " x="390" y="300" width="210" height="84" rx="10"/><text class="t" x="404" y="326">6  Train</text><text class="s" x="404" y="348">distill trainer, fresh LoRA</text><text class="n" x="404" y="368">789 examples · $1.17</text><rect class="at" x="518" y="311" width="72" height="19" rx="9.5"/><text class="pt at-t" x="554" y="324.5" text-anchor="middle">AgentTune</text><rect class="box " x="110" y="300" width="230" height="84" rx="10"/><text class="t" x="124" y="326">7  Gate</text><text class="s" x="124" y="348">8 checks, all required</text><text class="n" x="124" y="368">8 of 8 passed · $2.02</text><rect class="at" x="258" y="311" width="72" height="19" rx="9.5"/><text class="pt at-t" x="294" y="324.5" text-anchor="middle">AgentTune</text><rect class="ak" x="186" y="311" width="66" height="19" rx="9.5"/><text class="pt ak-t" x="219" y="324.5" text-anchor="middle">AuditKIT</text><path class="arrow" d="M640,342 H604" marker-end="url(#h)"/><path class="arrow" d="M390,342 H344" marker-end="url(#h)"/><path class="arrow" d="M225,384 V420"/><path class="arrow" d="M225,420 H145 V446" marker-end="url(#h)"/><path class="arrow" d="M225,420 H405 V446" marker-end="url(#h)"/><rect class="box " x="30" y="450" width="230" height="84" rx="10"/><text class="t" x="44" y="476">Promote <tspan class="ok">✓</tspan></text><text class="s" x="44" y="498">ledger on the Hub, rollback</text><text class="n" x="44" y="518"><tspan class="ok" font-weight="700">1 time:</tspan> round 16</text><rect class="box " x="290" y="450" width="230" height="84" rx="10"/><text class="t" x="304" y="476">Refuse <tspan class="bad">✗</tspan></text><text class="s" x="304" y="498">the old model keeps serving</text><text class="n" x="304" y="518"><tspan font-weight="700">11 times,</tspan> reasons traced</text><path class="arrow" d="M30,492 H12 V82"/><path class="arrow" d="M12,82 H26" marker-end="url(#h)"/><path class="arrow dash" d="M405,534 V560 H12 V492"/><rect class="at" x="30" y="576" width="72" height="19" rx="9.5"/><text class="pt at-t" x="66" y="589.5" text-anchor="middle">AgentTune</text><rect class="ak" x="110" y="576" width="66" height="19" rx="9.5"/><text class="pt ak-t" x="143" y="589.5" text-anchor="middle">AuditKIT</text><rect class="ours" x="184" y="576" width="39" height="19" rx="9.5"/><text class="pt ours-t" x="204" y="589.5" text-anchor="middle">ours</text><text class="foot" x="239.6" y="590">which kit runs each step</text><text class="foot" x="1020" y="590" text-anchor="end">Round 16: <tspan font-weight="700">2 h 24 min · $3.89 · no person in the loop</tspan></text></svg>
